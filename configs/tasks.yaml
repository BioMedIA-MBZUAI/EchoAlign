# Task metadata for the figures and the Extended Data tables.
#
# groups      anatomical groups in paper order, with their colour; short = heading used where space is tight
# sectors     Fig. 1b sectors in clockwise order
# targets     one entry per clinical target (one table row, one Fig. 1b spoke), in paper order
#   mode          classification | regression | ordinal (graded only)
#   group         anatomical group; sector: Fig. 1b sector
#   name          full name; short_name: Fig. 1b and caption name; figure_name: ED figure row; table_name: row under
#                 the group heading in the Extended Data tables (ordinal_table_name overrides it in the QWK table)
#   positive      positive definition (classification); unit: label unit (regression)
#   tasks         task id per cohort (cohorts as in configs/cohorts.yaml); cardiobench lists every benchmark task
#   ordinal       ordinal task id per cohort; graded_from_trace: cohorts whose grades start at trace
#   binary        raw label values the private binary task counts positive or negative; MIMIC-IV-Echo value sets
#                 are in scripts/make_mimic_labels.py
# cardiobench_datasets  count unit of each dataset in ED Fig. 1a, and how its tasks combine (max or sum)
# cardiobench           one entry per CardioBench task
groups:
- name: Left ventricle
  colour: '#B8322A'
- name: Atria
  colour: '#E0735A'
- name: Right ventricle
  colour: '#2C5F9E'
- name: Aortic valve
  colour: '#B7791F'
- name: Mitral valve
  colour: '#DDAA3C'
- name: Tricuspid and pulmonic valves
  colour: '#2F8062'
- name: Aorta and pulmonary circulation
  colour: '#5E3A96'
- name: Pericardium and inferior vena cava
  colour: '#7C7A72'
  short: Pericardium and IVC
- name: Devices and acquisition
  colour: '#55544f'
- name: Left atrium and mitral valve
  colour: '#E0735A'
- name: Right ventricle and pulmonary circulation
  colour: '#2C5F9E'
- name: Aorta and aortic valve
