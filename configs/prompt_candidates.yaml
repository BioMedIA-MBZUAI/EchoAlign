# Candidate zero-shot prompts for EchoAlign. scripts/select_prompts.py picks each private finding's prompts
# from these lists on the private validation split and writes configs/echoalign_prompts.yaml.
#
# findings   positive and negative candidate sentences per finding, in the order used to break ties. Each list
#            holds hand-written clinical sentences worded to the task's positive boundary, then the template
#            "<Finding> is present." or "No <finding>.". No sentence is taken from a patient report.
#            A finding without private labels (cardiac_tamponade, lv_filling_pressure, lvot_obstruction,
#            pericardial_effusion) takes its first three sentences per class, without selection.
# reuse      task of another cohort -> finding whose prompts it takes (selected or, without private labels, fixed).
# benchmark  CardioBench task -> positive and negative keys of `zero_shot_prompts` in
#            benchmarks/CardioBench/src/prompts.py; the task takes those prompts unchanged.
findings:
  aortic_regurgitation:
